name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python syntax and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check every Python script
        run: python -m py_compile python_scripts/*.py

      - name: Install flake8
        run: python -m pip install --upgrade pip flake8

      - name: Fail on real errors (undefined names, syntax faults)
        run: flake8 python_scripts --select=E9,F63,F7,F82,F821,F823 --max-line-length=120

      - name: Full style report (advisory)
        continue-on-error: true
        run: flake8 python_scripts --max-line-length=120 --statistics

  tests:
    name: Pytest suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run the test suite
        run: python -m pytest tests -q

  shell:
    name: Bash syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Syntax check every shell script
        run: |
          fail=0
          while IFS= read -r script; do
            printf 'bash -n %s\n' "$script"
            bash -n "$script" || fail=1
          done < <(find bash_scripts -type f -name '*.sh' | sort)
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more shell scripts failed the syntax check."
          fi
          exit "$fail"

      - name: Install ShellCheck
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: ShellCheck (advisory)
        continue-on-error: true
        run: shellcheck --severity=error bash_scripts/*.sh
